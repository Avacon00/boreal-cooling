name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 python3-pil python3-packaging \
            python3-hid python3-usb python3-smbus python3-docopt \
            python3-crcmod python3-colorlog
      - name: Testumgebung vorbereiten
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install "liquidctl==1.16.0"
      - name: Tests ausführen
        run: .venv/bin/python -m unittest discover -s tests -v
